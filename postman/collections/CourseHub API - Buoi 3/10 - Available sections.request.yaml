$kind: http-request
url: "{{base_url}}/sections?available_only=true"
method: GET
queryParams:
  available_only: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code la 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Cac lop tra ve deu con cho", () => {
          const data = pm.response.json();

          pm.expect(data).to.be.an("array");

          data.forEach(s => {
              pm.expect(s.remaining_slots).to.be.a("number");
              pm.expect(s.remaining_slots).to.be.above(0);
          });
      });
    language: text/javascript
order: 10000
